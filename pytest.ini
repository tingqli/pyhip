[pytest]
# Curated regression set; explicit paths override this list. See tests/README.md.
testpaths =
	tests/codegen/asm/test_basic.py
	tests/codegen/asm/test_cse.py
	tests/codegen/asm/test_dce.py
	tests/codegen/asm/test_dse.py
	tests/codegen/asm/test_debug_log.py
	tests/codegen/asm/test_div.py
	tests/codegen/asm/test_exprs.py
	tests/codegen/asm/test_jump.py
	tests/codegen/asm/test_pa_sv.py
	tests/codegen/asm/test_reduce.py
	tests/codegen/asm/test_simt.py
	tests/codegen/asm/test_softmax.py
	tests/codegen/asm/test_tbswizzle.py
	tests/codegen/asm/test_tensor.py
	tests/codegen/asm/test_wgload.py
	tests/ops/gemm/test_cdna4.py
	tests/ops/gemm/test_a4w4_mxfp4.py
	tests/ops/gr_read/test_gr_read.py
	tests/ops/moe/test_moe.py
	tests/ops/moe/test_tuned_moe.py
python_files = test_*.py
addopts = --import-mode=importlib -m "not perf"
markers =
	perf: explicit performance-only runs (select with -m perf)
