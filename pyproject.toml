[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhip"
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = ["filelock", "numpy"]
description = "AMDGPU kernels and language-specific development tools"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools_scm]
# Used when building from an sdist or tree without VCS metadata.
fallback_version = "1.0.0"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhip*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.cpp", "*.h", "*.hpp", "*.s", "*.md"]
