<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title description">
  <title id="title">N4：同一个CU内4＋4 wave错相的稳态时间轴</title>
  <desc id="description">时间从左往右，前四个wave交替执行Memory和Compute，后四个wave落后半个Memory加Compute周期。在当前子stage j等于step3、h16等于1处，同步时刻A只有前四个wave完成Memory j，同步时刻B两组都完成Memory j。3拍预取的CU在途VMEM指令上界分别是92和104，2拍分别是60和64。图是稳态程序序示意，不是实测周期或实际在途数曲线。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "WenQuanYi Micro Hei", sans-serif; fill: #18263b; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #526278; }
      .small { font-size: 18px; }
      .label { font-size: 22px; font-weight: 700; }
      .block-title { font-size: 24px; font-weight: 700; text-anchor: middle; }
      .block-detail { font-size: 18px; text-anchor: middle; }
      .tick { font-size: 18px; text-anchor: middle; fill: #64748b; }
      .tick-focus { font-size: 21px; font-weight: 700; text-anchor: middle; fill: #a44b08; }
      .count { font-size: 25px; font-weight: 700; text-anchor: middle; }
      .memory { fill: #dbeafe; stroke: #669aeb; stroke-width: 1.5; }
      .compute { fill: #dcfce7; stroke: #6dbd89; stroke-width: 1.5; }
      .barrier { stroke: #bcc8d8; stroke-width: 1.5; stroke-dasharray: 5 6; }
      .barrier-focus { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="1020" fill="#f8fafc"/>
  <rect x="24" y="20" width="1552" height="980" rx="20" fill="white" stroke="#dbe3ed"/>
  <text x="50" y="64" class="title">同一个 CU · 4＋4 wave 错相 · 稳态时间轴</text>
  <text x="50" y="99" class="subtitle">循环中间的一小段，不含启动／收尾。横向表示时间顺序；方块等宽仅便于阅读，不代表实测周期。</text>

  <rect x="50" y="121" width="24" height="18" rx="4" class="memory"/>
  <text x="84" y="137" class="small">Memory：wait、LDS搬运、发VMEM</text>
  <rect x="451" y="121" width="24" height="18" rx="4" class="compute"/>
  <text x="485" y="137" class="small">Compute：MFMA／VALU，无新增VMEM</text>
  <line x1="929" y1="120" x2="929" y2="141" class="barrier-focus"/>
  <text x="943" y="137" class="small">竖线：全8 wave的同一次barrier放行</text>

  <text x="454" y="177" class="small" text-anchor="middle">上一子stage j−1 = (step 3, h16 0)</text>
  <text x="862" y="177" class="label" text-anchor="middle">当前 j = (step 3, h16 1)</text>
  <text x="1270" y="177" class="small" text-anchor="middle">下一子stage j＋1 = (step 4, h16 0)</text>
  <line x1="234" y1="196" x2="1516" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1538" y="202" class="small" text-anchor="middle">t</text>
  <text x="250" y="226" class="tick">… 已在稳态</text>
  <text x="454" y="226" class="tick">A 上一段</text>
  <text x="658" y="226" class="tick">B 上一段</text>
  <text x="862" y="226" class="tick-focus">A 当前段</text>
  <text x="1066" y="226" class="tick-focus">B 当前段</text>
  <text x="1270" y="226" class="tick">A 下一段</text>
  <text x="1474" y="226" class="tick">B 下一段 …</text>

  <rect x="659" y="241" width="407" height="407" rx="14" fill="#fffbeb"/>
  <rect x="838" y="242" width="48" height="406" rx="10" fill="#fef3c7"/>
  <rect x="1042" y="242" width="48" height="406" rx="10" fill="#fef3c7"/>
  <line x1="250" y1="240" x2="250" y2="648" class="barrier"/>
  <line x1="454" y1="240" x2="454" y2="648" class="barrier"/>
  <line x1="658" y1="240" x2="658" y2="648" class="barrier"/>
  <line x1="862" y1="240" x2="862" y2="648" class="barrier-focus"/>
  <line x1="1066" y1="240" x2="1066" y2="648" class="barrier-focus"/>
  <line x1="1270" y1="240" x2="1270" y2="648" class="barrier"/>
  <line x1="1474" y1="240" x2="1474" y2="648" class="barrier"/>

  <text x="50" y="295" class="label">前4 wave</text>
  <text x="50" y="326" class="subtitle">wave 0–3</text>
  <text x="50" y="444" class="label">后4 wave</text>
  <text x="50" y="475" class="subtitle">wave 4–7</text>

  <rect x="256" y="258" width="192" height="110" rx="10" class="memory"/>
  <text x="352" y="294" class="block-title">Memory j−1</text>
  <text x="352" y="324" class="block-detail">每wave上界</text>
  <text x="352" y="351" class="block-detail">7 → 10</text>
  <rect x="460" y="258" width="192" height="110" rx="10" class="compute"/>
  <text x="556" y="294" class="block-title">Compute j−1</text>
  <text x="556" y="324" class="block-detail">无新增VMEM</text>
  <text x="556" y="351" class="block-detail">上界仍按10</text>
  <rect x="664" y="258" width="192" height="110" rx="10" class="memory"/>
  <text x="760" y="294" class="block-title">Memory j</text>
  <text x="760" y="324" class="block-detail">＋W、X、Y各1条</text>
  <text x="760" y="351" class="block-detail">10 → 13</text>
  <rect x="868" y="258" width="192" height="110" rx="10" class="compute"/>
  <text x="964" y="294" class="block-title">Compute j</text>
  <text x="964" y="324" class="block-detail">无新增VMEM</text>
  <text x="964" y="351" class="block-detail">上界仍按13</text>
  <rect x="1072" y="258" width="192" height="110" rx="10" class="memory"/>
  <text x="1168" y="294" class="block-title">Memory j＋1</text>
  <text x="1168" y="324" class="block-detail">wait≤3，再发3条</text>
  <text x="1168" y="351" class="block-detail">13 → 3 → 6</text>
  <rect x="1276" y="258" width="192" height="110" rx="10" class="compute"/>
  <text x="1372" y="294" class="block-title">Compute j＋1</text>
  <text x="1372" y="324" class="block-detail">无新增VMEM</text>
  <text x="1372" y="351" class="block-detail">上界仍按6</text>

  <text x="862" y="394" class="small" text-anchor="middle" fill="#a44b08">泳道方块中的数字：3拍预取，单wave在途指令数上界</text>

  <rect x="256" y="409" width="192" height="110" rx="10" class="compute"/>
  <text x="352" y="445" class="block-title">Compute j−2</text>
  <text x="352" y="475" class="block-detail">无新增VMEM</text>
  <text x="352" y="502" class="block-detail">上界仍按7</text>
  <rect x="460" y="409" width="192" height="110" rx="10" class="memory"/>
  <text x="556" y="445" class="block-title">Memory j−1</text>
  <text x="556" y="475" class="block-detail">每wave上界</text>
  <text x="556" y="502" class="block-detail">7 → 10</text>
  <rect x="664" y="409" width="192" height="110" rx="10" class="compute"/>
  <text x="760" y="445" class="block-title">Compute j−1</text>
  <text x="760" y="475" class="block-detail">无新增VMEM</text>
  <text x="760" y="502" class="block-detail">上界仍按10</text>
  <rect x="868" y="409" width="192" height="110" rx="10" class="memory"/>
  <text x="964" y="445" class="block-title">Memory j</text>
  <text x="964" y="475" class="block-detail">＋W、X、Y各1条</text>
  <text x="964" y="502" class="block-detail">10 → 13</text>
  <rect x="1072" y="409" width="192" height="110" rx="10" class="compute"/>
  <text x="1168" y="445" class="block-title">Compute j</text>
  <text x="1168" y="475" class="block-detail">无新增VMEM</text>
  <text x="1168" y="502" class="block-detail">上界仍按13</text>
  <rect x="1276" y="409" width="192" height="110" rx="10" class="memory"/>
  <text x="1372" y="445" class="block-title">Memory j＋1</text>
  <text x="1372" y="475" class="block-detail">wait≤3，再发3条</text>
  <text x="1372" y="502" class="block-detail">13 → 3 → 6</text>

  <text x="50" y="568" class="label">3拍 CU上界</text>
  <text x="50" y="616" class="label">2拍 CU上界</text>
  <g class="count">
    <text x="250" y="568">56</text><text x="454" y="568">68</text><text x="658" y="568">80</text>
    <text x="862" y="568">92</text><text x="1066" y="568">104</text><text x="1270" y="568">76</text><text x="1474" y="568">48</text>
    <text x="250" y="616">56</text><text x="454" y="616">56</text><text x="658" y="616">56</text>
    <text x="862" y="616">60</text><text x="1066" y="616">64</text><text x="1270" y="616">56</text><text x="1474" y="616">48</text>
  </g>
  <text x="50" y="646" class="small">单位：wave级VMEM指令条数；数字仅对应各同步时刻，不表示整个区间占用恒定。</text>

  <rect x="50" y="681" width="729" height="183" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="74" y="718" class="label">A：仅前4 wave发完了当前 Memory j</text>
  <text x="74" y="751" class="small">后4 wave刚做完上一段Compute，还没有开始Memory j。</text>
  <text x="74" y="795" class="label">3拍：4 × 13 ＋ 4 × 10 ＝ 92</text>
  <text x="74" y="837" class="label">2拍：4 × 8 ＋ 4 × 7 ＝ 60</text>

  <rect x="803" y="681" width="747" height="183" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="827" y="718" class="label">B：两组都发完了当前 Memory j</text>
  <text x="827" y="751" class="small">前4 wave已做完Compute j；不是8 wave同时发Memory！</text>
  <text x="827" y="795" class="label">3拍：4 × 13 ＋ 4 × 13 ＝ 104</text>
  <text x="827" y="837" class="label">2拍：4 × 8 ＋ 4 × 8 ＝ 64</text>

  <text x="50" y="907" class="small">• 每条泳道聚合4个wave；不代表组内逐周期锁步。较早完成的一组可在barrier等待，图中省略等待宽度。</text>
  <text x="50" y="941" class="small">• 这里不扣除请求的自然完成，所以是保守上界，不是实测在途数；Compute／barrier期间真实占用可以下降。</text>
  <text x="50" y="975" class="small">• s_barrier只同步wave，不等于vmcnt(0)。数据来自第92节既有ISA估算；本图没有运行GPU或新增采样。</text>
</svg>