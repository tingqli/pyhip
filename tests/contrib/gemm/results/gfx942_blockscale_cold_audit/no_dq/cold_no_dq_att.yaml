jobs:
    -
        kernel_include_regex: .*gemm_a8w8_blockscale_8wave_gfx942.*
        kernel_iteration_range: "[33]"
        output_directory: /tmp/gfx942_perf/cold_no_dq_att
        output_format: [json]
        advanced_thread_trace: true
        att_target_cu: 0
        att_shader_engine_mask: "0x1"
        att_simd_select: "0xf"
        att_buffer_size: "0x7f000000"